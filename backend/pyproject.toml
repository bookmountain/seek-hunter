[project]
name = "seekhunter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.6",
  "curl_cffi>=0.7",
  "selectolax>=0.3.27",
  "anthropic>=0.70",
  "pypdfium2>=5.14.0",
  "pillow>=13.0.0",
  "httpx>=0.27",
]

[project.scripts]
seekhunter = "seekhunter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seekhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` is idiomatic as an argument default.
"seekhunter/api.py" = ["B008"]
# The tailoring prompt is long prose inside a string literal.
"seekhunter/tailor/engine.py" = ["E501"]
